<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo – kunde-editor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="editor.css">
  <style>body { font-family: system-ui, sans-serif; margin: 20px; background: #fafafa; } .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }</style>
</head>
<body>
  <p>Lokal demo av kunde-editoren. «Legg i handlekurven» virker bare i Shopify.</p>
  <div class="grid">
    <div data-flis-editor data-preset="hund" data-variants='[{"id":1,"title":"Default Title","price":"499,00 kr","available":true}]'></div>
    <div data-flis-editor data-preset="hytte" data-variants='[{"id":2,"title":"Default Title","price":"499,00 kr","available":true}]'></div>
    <div data-flis-editor data-preset="familie" data-variants='[{"id":3,"title":"Default Title","price":"499,00 kr","available":true}]'></div>
  </div>
  <script src="../js/presets.js"></script>
  <script src="../js/processing.js"></script>
  <script src="../js/crop.js"></script>
  <script src="../js/text.js"></script>
  <script src="editor.js"></script>
</body>
</html>
